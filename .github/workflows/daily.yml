name: trend-radar

on:
  schedule:
    # 避开整点(GitHub cron 高峰排队严重,延迟可达 1-3 小时)
    - cron: "47 11 * * *"      # 目标北京 19:47 -> collect(延迟后约 20-21 点)
    - cron: "23 22 * * *"      # 每日 UTC 22:23 = 目标北京 06:23 -> digest(每日,延迟后约 7-9 点)
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        options: [digest, collect]
        default: digest

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "47 11 * * *" ]; then
            echo "mode=collect" >> "$GITHUB_OUTPUT"
          else
            echo "mode=digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline (${{ steps.mode.outputs.mode }})
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TRENDING_LANGUAGES: ${{ vars.TRENDING_LANGUAGES }}
          RECOMMEND_TOPICS: ${{ vars.RECOMMEND_TOPICS }}
          RECOMMEND_MIN_STARS: ${{ vars.RECOMMEND_MIN_STARS || '500' }}
          RECOMMEND_WINDOW_DAYS: ${{ vars.RECOMMEND_WINDOW_DAYS || '30' }}
          RECOMMEND_MAX_PER_TOPIC: ${{ vars.RECOMMEND_MAX_PER_TOPIC || '5' }}
          RECOMMEND_MAX_TOTAL: ${{ vars.RECOMMEND_MAX_TOTAL || '15' }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "collect" ]; then
            python main.py --collect
          else
            python main.py
          fi

      - name: Persist history.db & archive
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "actions@github.com"
          git add data/history.db docs/
          git diff --cached --quiet || git commit -m "chore: ${{ steps.mode.outputs.mode }} $(date -u +%F)"
          git pull --rebase origin main
          for i in 1 2 3; do git push && break || { echo "push failed, retry $i"; sleep 20; }; done
